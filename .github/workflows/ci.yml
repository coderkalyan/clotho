name: CI

# Tiered by trigger, because GitHub bills macOS at 10x and Windows at 2x the
# Linux minute rate. Feature-branch pushes get the cheap Linux x64 job only;
# every platform runs on main, nightly, and on demand.
on:
  push:
    # A documentation-only push should not spend six platforms' worth of
    # minutes. GitHub skips the run only when every changed path matches.
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Platforms to run
        type: choice
        options: [all, linux-only]
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # apt.llvm.org / Homebrew track the major; Windows pins an exact MSYS2 build.
  # Clotho's CMakeLists hard-requires major 22.
  LLVM_MAJOR: "22"
  LLVM_RELEASE: "22.1.8"
  MSYS2_LLVM_PKGREL: "3"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G
  # libsva is a Zig static library clotho's frontend links at build time
  # (docs/design/concurrent-assertions.md §1); pin the commit CI builds
  # against rather than floating on whatever main happens to be, since
  # nothing else records this today (§8's delivery-mechanism decision is
  # still open — this is the minimal fix, not that one).
  ZIG_VERSION: "0.16.0"
  LIBSVA_REF: "0f41ddad8277b1625b51610ac76b1ae25728de08"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          cat > all.json <<'JSON'
          [
            {"name": "linux-x64",     "runner": "ubuntu-24.04",    "shell": "bash"},
            {"name": "linux-arm64",   "runner": "ubuntu-24.04-arm", "shell": "bash"},
            {"name": "macos-arm64",   "runner": "macos-15",        "shell": "bash"},
            {"name": "macos-x64",     "runner": "macos-15-intel",  "shell": "bash"},
            {"name": "windows-x64",   "runner": "windows-2025",   "msystem": "CLANG64",    "shell": "msys2 {0}", "zig": "x86_64-windows",  "zig_sha256": "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"},
            {"name": "windows-arm64", "runner": "windows-11-arm",  "msystem": "CLANGARM64", "shell": "msys2 {0}", "zig": "aarch64-windows", "zig_sha256": "aee38316ee4111717900f45dd3130145c39289e105541d737eb8c5ed653c78ef", "experimental": true}
          ]
          JSON
          # A `ci/`-prefixed branch opts into the full matrix on every push.
          # GitHub only offers workflow_dispatch for workflows that already
          # exist on the default branch, so without this there is no way to
          # exercise the expensive platforms while iterating on CI itself.
          case "${{ github.event_name }}:${{ inputs.scope }}" in
            workflow_dispatch:linux-only) full=0 ;;
            workflow_dispatch:*|schedule:*) full=1 ;;
            *) case "${{ github.ref }}" in
                 refs/heads/main|refs/heads/ci/*) full=1 ;;
                 *) full=0 ;;
               esac ;;
          esac
          if [ "$full" = 1 ]; then
            echo "matrix=$(jq -c . all.json)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -c '[.[0]]' all.json)" >> "$GITHUB_OUTPUT"
          fi
          echo "full tier: $full"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    # windows-arm64 is still the only target with known failures, so it alone
    # stays advisory; every other target gates.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Per-step `shell:` cannot see the matrix context; the job-level default
    # can. Windows runs every step inside the MSYS2 environment, everything
    # else in plain bash.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # Zig builds libsva (CLOTHO_SVA in CMakeLists.txt). Windows installs it
      # in its own step below, since a JS action's PATH addition is not
      # guaranteed to reach the msys2 shell every later step runs in.
      - name: Install Zig (Linux/macOS)
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # -- toolchain --------------------------------------------------------
      # LLVM is never built here: a source build is tens of minutes and the
      # pin moves at most twice a year. Each platform takes the cheapest
      # prebuilt that ships the CMake package and the dev libraries.
      - name: Install LLVM and toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-$LLVM_MAJOR main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          # clang, not GCC. Ubuntu 24.04 caps out at GCC 14, which rejects the
          # implicit capture of an enclosing-class member inside a deducing-this
          # lambda (LlvmBackend.cpp's close_fn) — a GCC 14 defect fixed in 15,
          # and 15 is not available on any GitHub-hosted image. libstdc++-14-dev
          # supplies <print>, which src/main.cpp uses and GCC 13's does not have.
          # The -dev packages are what LLVM's exported CMake targets link
          # against. libc++'s headers, compiler-rt's builtins and lld's libraries
          # are what `clotho build` puts into an executable
          # (docs/design/executables.md).
          sudo apt-get install -y --no-install-recommends \
            llvm-$LLVM_MAJOR-dev clang-$LLVM_MAJOR libstdc++-14-dev ninja-build ccache \
            zlib1g-dev libzstd-dev libxml2-dev libncurses-dev libedit-dev \
            libc++-$LLVM_MAJOR-dev libclang-rt-$LLVM_MAJOR-dev liblld-$LLVM_MAJOR-dev
          echo "LLVM_DIR=/usr/lib/llvm-$LLVM_MAJOR/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CC=clang-$LLVM_MAJOR"    >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_MAJOR" >> "$GITHUB_ENV"

      - name: Install LLVM and toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          # llvm@22 is currently an alias of the `llvm` formula and becomes a
          # real versioned formula once 23 ships; fall back while it is an alias
          # only in name.
          brew install ninja ccache
          brew install llvm@$LLVM_MAJOR || brew install llvm
          prefix=$(brew --prefix llvm@$LLVM_MAJOR 2>/dev/null || brew --prefix llvm)
          "$prefix/bin/clang++" --version
          echo "LLVM_DIR=$prefix/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CC=$prefix/bin/clang"    >> "$GITHUB_ENV"
          echo "CXX=$prefix/bin/clang++" >> "$GITHUB_ENV"
          # Link Homebrew LLVM's own libc++, not the SDK's. CMake seeds
          # CMAKE_EXE_LINKER_FLAGS from LDFLAGS and CMAKE_CXX_FLAGS from
          # CXXFLAGS at first configure.
          echo "LDFLAGS=-L$prefix/lib/c++ -L$prefix/lib/unwind -lunwind -Wl,-rpath,$prefix/lib/c++" \
            >> "$GITHUB_ENV"
          # libc++'s headers annotate anything whose implementation lives in the
          # shared library with the macOS version that first shipped it, and
          # floating-point std::from_chars (Runtime.cpp's real parsing) is marked
          # macOS 26. Those annotations describe Apple's system libc++; we link
          # Homebrew's, which has the symbol, so turn them off.
          echo "CXXFLAGS=-D_LIBCPP_DISABLE_AVAILABILITY" >> "$GITHUB_ENV"

      # MSYS2's CLANG64/CLANGARM64 environments build LLVM as MinGW-w64/UCRT, so
      # Windows uses clang with libc++ and no MSVC ABI, CRT or STL anywhere.
      # That is not only a toolchain preference: against the MSVC-ABI release
      # tarball this build also had to
      # work around a DIA SDK path baked into LLVM's exported targets, an
      # expected-lite/std::expected divergence in the MSVC STL, mimalloc
      # colliding with the CRT's allocator symbols, compiler-rt's builtins not
      # being linked, and an import library clobbering a static archive of the
      # same name. None of those exist here.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # pacboy's `:p` suffix picks the environment's package prefix, so one
          # list serves both CLANG64 and CLANGARM64. Python is slang's — its
          # CMakeLists requires an interpreter for its generated sources.
          # git, curl and unzip are unprefixed (msys packages, not arch-specific
          # mingw ones): path-type stays the default `minimal`, which does not
          # inherit Git for Windows' own PATH entry, and the libsva checkout and
          # zig install steps below need them inside this shell.
          pacboy: >-
            cmake:p ninja:p ccache:p python:p git curl unzip

      # MSYS2 cannot pin a version and its repository has moved past LLVM 22, so
      # install the exact LLVM_RELEASE build from MSYS2's package archive. pacman
      # checks each package's signature; the cc-libs (libc++, libunwind) the
      # environment already has stay current, which libc++ supports.
      # TODO: drop this pin when Clotho moves to LLVM 23.
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eux
          repo="https://repo.msys2.org/mingw/${MSYSTEM,,}"
          pkgs=
          for p in llvm llvm-libs llvm-tools clang clang-libs lld compiler-rt; do
            pkgs="$pkgs $repo/$MINGW_PACKAGE_PREFIX-$p-$LLVM_RELEASE-$MSYS2_LLVM_PKGREL-any.pkg.tar.zst"
          done
          pacman -U --noconfirm $pkgs
          clang --version
          llvm-config --version

      # MSYS2 packages no zig for CLANG64 or CLANGARM64, so take the official
      # release archive, checked against the hash ziglang.org publishes for it,
      # and hand its path to CMake rather than to PATH.
      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eux
          name="zig-${{ matrix.zig }}-$ZIG_VERSION"
          dir="$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSL -o "$dir/$name.zip" "https://ziglang.org/download/$ZIG_VERSION/$name.zip"
          echo "${{ matrix.zig_sha256 }}  $dir/$name.zip" | sha256sum -c -
          unzip -q "$dir/$name.zip" -d "$dir"
          "$dir/$name/zig.exe" version
          echo "ZIG_EXECUTABLE=$(cygpath -m "$dir/$name/zig.exe")" >> "$GITHUB_ENV"

      # libsva is a build-only, sibling-checkout dependency
      # (CLOTHO_LIBSVA_DIR defaults to ../libsva relative to this repo); not
      # a submodule, so clone it explicitly rather than relying on whatever
      # a runner image happens to have lying around.
      - name: Check out libsva
        run: |
          set -eux
          git clone https://github.com/coderkalyan/libsva ../libsva
          git -C ../libsva checkout "$LIBSVA_REF"

      # -- caches -----------------------------------------------------------
      # slang is pinned to a SHA, so FetchContent does a full (non-shallow)
      # clone of it every run. Cache the populated sources, keyed on the pins.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      # -- build and test ---------------------------------------------------
      - name: Configure
        run: |
          set -eux
          # Deliberately not a bash array: the macOS runners' /bin/bash is 3.2,
          # where expanding an empty array under `set -u` is an error.
          launcher=
          if command -v ccache > /dev/null; then
            launcher="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          # ZIG_EXECUTABLE is set only on Windows (the zig install step above).
          # A release build leaves out `lsp`, `dap` and `build`; CI builds them so
          # their tests run on every platform.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCLOTHO_LSP=ON -DCLOTHO_DAP=ON -DCLOTHO_BUILD_COMMAND=ON \
            ${ZIG_EXECUTABLE:+-DZIG_EXECUTABLE=$ZIG_EXECUTABLE} \
            $launcher

      - name: Build
        run: cmake --build build --target clotho_test clotho_cli

      - name: Test
        run: |
          set -eu
          # One CTest entry per test file (CMakeLists.txt), run in parallel. Each
          # entry passes --duration, so a hard crash (which prints no doctest
          # summary at all) still names its case in that entry's output.
          ctest --test-dir build --output-on-failure -j "$(getconf _NPROCESSORS_ONLN)"

      # End-to-end proof the JIT actually executes on this host, independent of
      # the doctest harness: parse, lower, compile, run.
      - name: Smoke test the CLI
        run: |
          set -eux
          exe=build/clotho
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          out=$("$exe" run examples/initial.v)
          echo "$out"
          [ "$out" = "Hello, world!" ]

      - name: ccache statistics
        if: always()
        run: ccache --show-stats
