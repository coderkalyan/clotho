name = "thunk_comb"
description = "256 combinational procs, each a distinct-sensitivity trivial body (always @(a_i) y_i = a_i ^ k), one clocked driver toggling every a_i for 100k cycles. Distinct sensitivity sets are fusion-INELIGIBLE, so the activation count stays 256 per cycle. Each body is suspension-free, so by default (SimulationConfig::thunk) it lowers to a plain thunk call; with thunk=false (reachable only from a test) the same 256 procs are coroutines, and the pair brackets the per-activation coroutine (frame + resume/suspend) overhead that fusion cannot hide. Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done 03e7b700"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true
