name = "thunk_comb"
description = "256 combinational procs, each a distinct-sensitivity trivial body (always @(a_i) y_i = a_i ^ k), one clocked driver toggling every a_i for 100k cycles. Distinct sensitivity sets are fusion-INELIGIBLE, so the default count stays 256 coroutines -- isolates per-activation coroutine (frame + resume/suspend) overhead that fusion cannot hide. Target of a planned thunk lowering (run non-suspending procs as a plain call). Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done 03e7b700"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true

