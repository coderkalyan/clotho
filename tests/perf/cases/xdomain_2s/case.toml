name = "xdomain_2s"
description = "Hand-written 2-state oracle for xdomain: the identical design with bit types, which clotho lowers natively (docs/design/two-state.md). Post-reset trajectories match the 4-state case exactly (the reset-release re-seed overwrites every reg; last NBA to the same var wins), so both print the same checksum. sim_ms here is the floor the 4-state case would reach if the per-op 4-state tax were fully removed. Generated by bench-sched/gen.py xdomain --two-state."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done c1e0f415"

[oracles.iverilog]
enabled = false
note = "clotho-internal ceiling reference; cross-simulator comparison lives on the 4-state xdomain case"

[oracles.verilator]
enabled = false
note = "clotho-internal ceiling reference; cross-simulator comparison lives on the 4-state xdomain case"

