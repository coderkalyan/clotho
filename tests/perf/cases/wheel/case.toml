name = "wheel"
description = "Timestep-bound clock microbench: one #delay clock generator + one trivial clocked process, 8M cycles. ~2 wheel ticks per cycle dominate the single per-cycle activation, so sim time is gated by the timing wheel and the JIT<->runtime ABI boundary (rt_wheel_advance) rather than process activation — the axis the activation-bound thunk_* cases hide. Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done e4e87200"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true

