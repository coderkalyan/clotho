name = "combchain"
description = "512-deep combinational module chain (one assign per stage, wired through ports); every clock edge ripples a 512-activation wave down the chain for 20k cycles (~10.2M activations). Dominated by per-wave wake/subscription/port-copy cost -- the cost comb-process fusion targets (docs/design/comb-fusion.md). Clotho's smallest sim lead over iverilog (~2.5x, 2026-07): per-activation cost here is ~4x the thunk_comb figure. Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done 0000ec60"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true
