name = "onehot"
description = "One clocked process holding the reverse-case one-hot priority-encoder idiom: case (1'b1) over 512 single-bit selects sel[i] of a packed vector, 200k cycles. First set bit in source order wins (LRM 12.5). A walking one-hot sel rotates each cycle so every arm fires in turn. Lowers to an O(N) sel[i] === 1'b1 compare chain today; a count-trailing-zeros + jump table would flatten dispatch and compile. Generated by bench-sched/gen.py onehot."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done b84e9360"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true
