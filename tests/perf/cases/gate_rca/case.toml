name = "gate_rca"
description = "64 independent 32-bit ripple-carry binary counters built from XOR and AND gate primitives (K=64, BITS=32, cycles=100k). Counter k initialized to k×65537; bit 0 always toggles (XOR 1'b1), carry ripples through 31 AND gates (depth-32 chain). Total: 4032 gate instances, 2048 1-bit FFs in one NBA block. Measures gate evaluation throughput and worklist cascade depth on a depth-32 chain — the critical-path shape of synthesized arithmetic. No fixed points. Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done 00400000"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true

