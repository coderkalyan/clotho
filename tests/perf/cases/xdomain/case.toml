name = "xdomain"
description = "Reset-then-run 4-state overhead ceiling, 4-state half of the xdomain pair. One fused clocked process updates 128 x-initialized regs, each through 4 chained 9-op rounds (add/xor/and/or/shift/compare/mux/not), 100k cycles: the regs carry x from t0 until the reset-release edge re-seeds them (~100 edges), then stay 2-state -- so per-op 4-state lowering cost on clean data dominates. The sim_ms gap to xdomain_2s (same design, bit types, same checksum) is the per-op 4-state tax: the ceiling for never-x inference / dynamic domain specialization. Static never-x cannot prove these regs clean (pre-seed reads see x). Generated by bench-sched/gen.py xdomain."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done c1e0f415"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true
