name = "timers"
description = "512 free-running always #p toggles with distinct prime periods (3..3673) to t=2000003: ~5.8M timer events with 512 timers pending concurrently across wheel levels. The single-timer wheel bench never holds more than a couple of pending entries; this is the populated-wheel schedule/advance cost. Watchdog samples at a time no period divides (same-instant sampling is legal nondeterminism). Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done a6284559"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true
