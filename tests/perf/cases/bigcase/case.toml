name = "bigcase"
description = "One clocked process with a 2048-entry case over a hashed selector, 200k cycles. Tracks two costs on one design: tier-0 LLVM compile of a large single function (measured superlinear: 1024 entries 0.7s, 4096 entries 11.6s llvm, 2026-07 -- 30k straight-line statements segfault outright) and case-dispatch sim cost (lowers to a compare chain, per-cycle cost grows with N; a jump table would flatten it). iverilog compiles the 4096 variant in 31ms -- clotho loses total wall on short runs of case-heavy designs. Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done 07ae52a0"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true

