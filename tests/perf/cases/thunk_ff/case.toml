name = "thunk_ff"
description = "256 edge-triggered procs, each a trivial blocking self-update (always @(posedge clk) if (cyc<N) q_i = q_i + k), 200k cycles. Blocking (not NBA) so the bench isolates per-activation coroutine overhead rather than the NBA heap-churn path (an unimplemented inline-storage win) whose allocator jitter otherwise dominates; each q_i reads only itself so it stays race-free. Run with --no-fuse so the shared-sensitivity procs stay 256 separate coroutines instead of fusing to one -- exposes the coroutine population a planned thunk lowering removes on top of static fusion (fused default ~140 ms vs --no-fuse ~950 ms brackets the residual). Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]
# --no-fuse keeps the 256 procs unfused so the coroutine population is visible;
# fusion is measured separately (default) and would otherwise mask the overhead.
args = ["--no-fuse"]

[check]
stdout_regex = "done e8f18000"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true

