name = "thunk_ff"
description = "256 edge-triggered procs, each a trivial blocking self-update (always @(posedge clk) if (cyc<N) q_i = q_i + k), 200k cycles. Every proc shares one canonical (clk, posedge) sensitivity set and no body suspends, so V1 static fusion collapses them into one coroutine per 256-member group: what this measures is the FUSED clocked path -- group dispatch plus body throughput at the group-size cap, with per-activation scheduler cost already removed. Blocking (not NBA) so the bench isolates that rather than the NBA heap-churn path (an unimplemented inline-storage win) whose allocator jitter otherwise dominates; each q_i reads only itself so it stays race-free. HISTORY: until 2026-08 the case ran --no-fuse, keeping 256 separate coroutines to expose the per-activation coroutine overhead a planned thunk lowering removes on top of fusion (sim 886 ms unfused at 'test: thunk lowering eligibility matrix + coroutine equivalence' vs 143 ms fused -- the pair bracketed the residual). That CLI toggle is gone for good (docs/design/cli.md: the --no-* bisect toggles went with the command-based driver), so the unfused bracket is now reachable only by setting SimulationConfig::fuse from a test, and the baseline below is the fused number. Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done e8f18000"

[oracles.iverilog]
enabled = true

[oracles.verilator]
enabled = true

