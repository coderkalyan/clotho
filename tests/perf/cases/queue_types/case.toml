name = "queue_types"
description = "56 distinct queue element types (plain bits, structs with strings, nested queues) in one module, every queue operation used once per type in straight-line code. Tracks the compile cost of the queue engine linked into a design as bitcode (docs/design/dynamic-arrays.md section 14): every site runs once, so each stays a call into the runtime, and what the design pays to compile is the element kernels. Generated by gen.py."
top = "top"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done 56"

[oracles.iverilog]
enabled = false
note = "iverilog does not support unpacked structs."

[oracles.verilator]
enabled = true
