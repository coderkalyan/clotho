name = "case_inside"
description = "One clocked process with a 2048-item `case ... inside` (LRM 12.5.4) over a swept selector, 200k cycles; every 8th item is a [lo:hi] range, the rest singular constants. Tracks the recursive-switch-segmentation win: constant runs between range breaks should jump-table (per-cycle dispatch flat in N), vs an unsegmented O(N) chain today. Generated by bench-sched/gen.py."
top = "top"

[fetch]
script = "fetch.sh"
probe = "design.sv"

[clotho]
files = ["design.sv"]

[check]
stdout_regex = "done 2f41e178"

[oracles.iverilog]
enabled = false
note = "iverilog does not implement case ... inside (syntax error on the construct)"

[oracles.verilator]
enabled = true
